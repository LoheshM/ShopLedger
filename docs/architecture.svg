<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="desc">Architecture map of ShopLedger browser, Express server, routers, libraries, configuration and JSON storage, with numbered order placement steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#18253a}
      .title{font-size:24px;font-weight:700;letter-spacing:.2px}
      .subtitle{font-size:13px;fill:#52647b}
      .section{font-size:14px;font-weight:700;letter-spacing:1px;fill:#52647b}
      .head{font-size:15px;font-weight:700}
      .body{font-size:12px;fill:#45566d}
      .tiny{font-size:12px;fill:#52647b}
      .flow-title{fill:#bdd2ef}
      .flow-head{fill:#fff}
      .flow-body{fill:#e0eaf6}
      .flow-number{fill:#10223a}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
      .wire{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .softwire{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f4f7fb"/>
  <text x="28" y="39" class="title">ShopLedger · application architecture</text>
  <text x="28" y="61" class="subtitle">POS · Khata credit ledger · GST invoicing · JSON file storage</text>

  <!-- Top-level runtime -->
  <rect x="24" y="82" width="238" height="110" rx="12" fill="#e8f1ff" stroke="#9bb9e7" stroke-width="1.4"/>
  <text x="42" y="108" class="head">Browser UI · public/</text>
  <text x="42" y="130" class="body">index.html · js/app.js · css/style.css</text>
  <text x="42" y="151" class="body">Catalog · cart · orders · Khata · reports</text>
  <text x="42" y="172" class="body">POST /api/orders to place an order</text>

  <rect x="322" y="82" width="294" height="110" rx="12" fill="#fff" stroke="#7890ae" stroke-width="1.5"/>
  <text x="342" y="108" class="head">server.js · Express app</text>
  <text x="342" y="130" class="body">JSON body parsing · serves public/</text>
  <text x="342" y="151" class="body">Mounts all four routers at /api</text>
  <text x="342" y="172" class="body">GET /orders/:id/invoice → invoice.render()</text>

  <rect x="937" y="82" width="239" height="110" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="956" y="108" class="head">config.js</text>
  <text x="956" y="130" class="body">Shop · port · default GST</text>
  <text x="956" y="151" class="body">HSN slabs · coupon rules · admin key</text>
  <text x="956" y="172" class="body">Read by server and lib modules</text>

  <path d="M262 137H318" class="wire"/>
  <path d="M616 137H674V224H405V250" class="wire"/>
  <text x="625" y="128" class="tiny">HTTP requests</text>
  <path d="M585 192V214H828V333" class="softwire"/>

  <!-- Routers -->
  <text x="25" y="236" class="section">ROUTES · API HANDLERS</text>
  <rect x="24" y="251" width="380" height="383" rx="12" fill="#edf3fa" stroke="#cfdae7"/>
  <rect x="38" y="266" width="352" height="78" rx="9" class="card"/>
  <text x="52" y="288" class="head">routes/products.js</text>
  <text x="52" y="309" class="body">GET /products · GET /coupons</text>
  <text x="52" y="328" class="body">Uses inventory, tax, coupons</text>

  <rect x="38" y="353" width="352" height="104" rx="9" fill="#fff8e8" stroke="#e9c66f" stroke-width="1.5"/>
  <text x="52" y="375" class="head">routes/orders.js</text>
  <text x="52" y="396" class="body">GET /orders · GET /orders/:id</text>
  <text x="52" y="415" class="body">POST /orders · POST /orders/:id/cancel</text>
  <text x="52" y="436" class="body">Order flow starts here</text>

  <rect x="38" y="466" width="352" height="78" rx="9" class="card"/>
  <text x="52" y="488" class="head">routes/customers.js</text>
  <text x="52" y="509" class="body">GET /customers · POST /customers/:id/settle</text>
  <text x="52" y="528" class="body">Uses ledger · store</text>

  <rect x="38" y="553" width="352" height="65" rx="9" class="card"/>
  <text x="52" y="575" class="head">routes/reports.js</text>
  <text x="52" y="596" class="body">Dashboard · GST reconciliation · preview · export</text>

  <!-- Libraries -->
  <text x="429" y="236" class="section">LIB · BUSINESS LOGIC AND STORAGE</text>
  <rect x="428" y="251" width="540" height="383" rx="12" fill="#edf3fa" stroke="#cfdae7"/>
  <rect x="441" y="265" width="254" height="66" rx="8" class="card"/>
  <text x="453" y="285" class="head">lib/coupons.js</text>
  <text x="453" y="305" class="body">normalizeCode · validate · calculateDiscount</text>
  <text x="453" y="321" class="body">getCoupon · listActive</text>
  <rect x="703" y="265" width="251" height="66" rx="8" class="card"/>
  <text x="715" y="285" class="head">lib/dates.js</text>
  <text x="715" y="305" class="body">today · normalizeDateKey · getFiscalYear</text>

  <rect x="441" y="337" width="254" height="66" rx="8" class="card"/>
  <text x="453" y="357" class="head">lib/inventory.js</text>
  <text x="453" y="377" class="body">find · check · reserve · release</text>
  <text x="453" y="393" class="body">getSellableStock · summarize</text>
  <rect x="703" y="337" width="251" height="66" rx="8" fill="#f2eaff" stroke="#9d75d8" stroke-width="2"/>
  <text x="715" y="357" class="head" fill="#59359a">lib/invoice.js · TICKET</text>
  <text x="715" y="377" class="body">computeInvoiceFigures · render</text>
  <text x="715" y="393" class="body">Recomputes printable invoice totals</text>

  <rect x="441" y="409" width="254" height="66" rx="8" class="card"/>
  <text x="453" y="429" class="head">lib/ledger.js</text>
  <text x="453" y="449" class="body">findCustomer · listCustomers · chargeOrderToKhata</text>
  <text x="453" y="465" class="body">recordSettlement · reverseOrderDebit</text>
  <rect x="703" y="409" width="251" height="66" rx="8" class="card"/>
  <text x="715" y="429" class="head">lib/orders.js</text>
  <text x="715" y="449" class="body">add · get · cancel · list</text>

  <rect x="441" y="481" width="254" height="66" rx="8" class="card"/>
  <text x="453" y="501" class="head">lib/pricing.js</text>
  <text x="453" y="521" class="body">subtotal · discount · computeTotals</text>
  <text x="453" y="537" class="body">Calls tax.js and coupons.js</text>
  <rect x="703" y="481" width="251" height="66" rx="8" class="card"/>
  <text x="715" y="501" class="head">lib/reports.js</text>
  <text x="715" y="521" class="body">getDashboardSummary</text>
  <text x="715" y="537" class="body">getGstReconciliation</text>

  <rect x="441" y="553" width="254" height="66" rx="8" class="card"/>
  <text x="453" y="573" class="head">lib/store.js</text>
  <text x="453" y="593" class="body">read · write · appendAudit</text>
  <rect x="703" y="553" width="251" height="66" rx="8" class="card"/>
  <text x="715" y="573" class="head">lib/tax.js</text>
  <text x="715" y="593" class="body">getRateForItem · getSlabPercent</text>
  <text x="715" y="609" class="body">splitCgstSgst · checkout pricing only</text>

  <!-- Persistence and legend -->
  <text x="991" y="236" class="section">PERSISTENCE</text>
  <rect x="988" y="251" width="188" height="126" rx="12" fill="#e9f7f0" stroke="#7bb99b" stroke-width="1.4"/>
  <text x="1004" y="278" class="head">data/db.json</text>
  <text x="1004" y="300" class="body">products · orders</text>
  <text x="1004" y="319" class="body">customers · settlements</text>
  <text x="1004" y="338" class="body">auditLog · next IDs</text>
  <text x="1004" y="360" class="body">Read/written by lib/store.js</text>

  <path d="M390 405H421" class="softwire"/>
  <text x="394" y="395" class="tiny">calls</text>
  <path d="M954 585H978V349H984" class="wire"/>
  <text x="988" y="403" class="tiny">JSON read/write</text>
  <text x="837" y="224" class="tiny">invoice route</text>

  <rect x="988" y="430" width="188" height="126" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="1004" y="455" class="head">Legend</text>
  <rect x="1005" y="469" width="18" height="18" rx="4" fill="#f2eaff" stroke="#9d75d8" stroke-width="2"/>
  <text x="1032" y="483" class="body">Ticket module</text>
  <line x1="1005" y1="505" x2="1023" y2="505" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1032" y="509" class="body">Runtime / data flow</text>
  <line x1="1005" y1="531" x2="1023" y2="531" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1032" y="535" class="body">Module calls</text>
  <text x="990" y="581" class="tiny">tax.js is not imported by invoice.js</text>

  <!-- Numbered order placement flow -->
  <rect x="24" y="650" width="1152" height="128" rx="14" fill="#14263f"/>
  <text class="flow-title" x="43" y="676" font-size="14" font-weight="700" letter-spacing="1" fill="#bdd2ef">ORDER PLACEMENT · NUMBERED FLOW</text>
  <g>
    <rect x="40" y="691" width="174" height="68" rx="9" fill="#203955" stroke="#3c5b7c"/>
    <circle cx="58" cy="709" r="11" fill="#7eb3ff"/><text class="flow-number" x="54" y="713" font-size="12" font-weight="700" fill="#10223a">1</text>
    <text class="flow-head" x="76" y="713" font-size="12" font-weight="700" fill="#fff">Browser</text>
    <text class="flow-body" x="52" y="736" font-size="12" fill="#d8e4f3">POST /api/orders</text>

    <rect x="226" y="691" width="174" height="68" rx="9" fill="#203955" stroke="#3c5b7c"/>
    <circle cx="244" cy="709" r="11" fill="#7eb3ff"/><text class="flow-number" x="240" y="713" font-size="12" font-weight="700" fill="#10223a">2</text>
    <text class="flow-head" x="262" y="713" font-size="12" font-weight="700" fill="#fff">routes/orders.js</text>
    <text class="flow-body" x="238" y="736" font-size="12" fill="#d8e4f3">Resolve lines · check stock</text>

    <rect x="412" y="691" width="174" height="68" rx="9" fill="#203955" stroke="#3c5b7c"/>
    <circle cx="430" cy="709" r="11" fill="#7eb3ff"/><text class="flow-number" x="426" y="713" font-size="12" font-weight="700" fill="#10223a">3</text>
    <text class="flow-head" x="448" y="713" font-size="12" font-weight="700" fill="#fff">Pricing</text>
    <text class="flow-body" x="424" y="736" font-size="12" fill="#d8e4f3">coupon · subtotal · GST slabs</text>

    <rect x="598" y="691" width="174" height="68" rx="9" fill="#203955" stroke="#3c5b7c"/>
    <circle cx="616" cy="709" r="11" fill="#7eb3ff"/><text class="flow-number" x="612" y="713" font-size="12" font-weight="700" fill="#10223a">4</text>
    <text class="flow-head" x="634" y="713" font-size="12" font-weight="700" fill="#fff">Khata / inventory</text>
    <text class="flow-body" x="610" y="736" font-size="12" fill="#d8e4f3">Debit account if needed · reserve</text>

    <rect x="784" y="691" width="174" height="68" rx="9" fill="#203955" stroke="#3c5b7c"/>
    <circle cx="802" cy="709" r="11" fill="#7eb3ff"/><text class="flow-number" x="798" y="713" font-size="12" font-weight="700" fill="#10223a">5</text>
    <text class="flow-head" x="820" y="713" font-size="12" font-weight="700" fill="#fff">Orders + store</text>
    <text class="flow-body" x="796" y="736" font-size="12" fill="#d8e4f3">Append order · write db.json</text>

    <rect x="970" y="691" width="190" height="68" rx="9" fill="#203955" stroke="#3c5b7c"/>
    <circle cx="988" cy="709" r="11" fill="#7eb3ff"/><text class="flow-number" x="984" y="713" font-size="12" font-weight="700" fill="#10223a">6</text>
    <text class="flow-head" x="1006" y="713" font-size="12" font-weight="700" fill="#fff">Response</text>
    <text class="flow-body" x="982" y="736" font-size="12" fill="#d8e4f3">201 order JSON → browser</text>
  </g>
  <path d="M214 725H222M400 725H408M586 725H594M772 725H780M958 725H966" stroke="#91b5df" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
